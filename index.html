<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>clones whirld</title>
<meta name="description" content="clones whirld">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #000;
    transition: background-color 0.6s ease;
  }
  #scene { position: fixed; inset: 0; display: block; }
  #hero {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 2;
    width: 100%;
    padding: 0 16px;
  }
  #hero h1 {
    display: inline-block;
    font-size: clamp(1.4rem, 6.5vw, 4rem);
    font-weight: 200;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: color 0.6s ease, text-shadow 0.6s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #hint {
    position: fixed;
    top: 5vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.68rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    z-index: 2;
    transition: opacity 1s ease, color 0.6s ease;
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hint">drag to spin &middot; tap title for color</div>
  <div id="hero"><h1 id="title">clones whirld</h1></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (function () {
    // --- color themes ---
    const THEMES = {
      amber:  { bgIn: '#17110a', bgOut: '#000000', dot: 0xffb24d, wire: 0x3a2912, glow: 0x1a1308, star: 0xe0c48f, text: '#fff3e0', sub: 'rgba(224,186,128,0.65)', shadow: 'rgba(255,180,80,0.45)' },
      mono:   { bgIn: '#161616', bgOut: '#000000', dot: 0xffffff, wire: 0x2a2a2a, glow: 0x0d0d0d, star: 0xdddddd, text: '#ffffff', sub: 'rgba(205,205,205,0.6)', shadow: 'rgba(255,255,255,0.40)' },
      green:  { bgIn: '#04140c', bgOut: '#000000', dot: 0x4dff88, wire: 0x0c3a22, glow: 0x06180f, star: 0xa6f0c0, text: '#e8ffe8', sub: 'rgba(140,230,170,0.65)', shadow: 'rgba(90,255,150,0.40)' },
      violet: { bgIn: '#0c0414', bgOut: '#000000', dot: 0xd24dff, wire: 0x301048, glow: 0x160824, star: 0xd9a8e8, text: '#ffffff', sub: 'rgba(214,160,232,0.65)', shadow: 'rgba(200,80,255,0.45)' },
    };
    const ORDER = ['amber', 'mono', 'green', 'violet'];

    let idx = 0;
    try {
      const saved = localStorage.getItem('whirld-theme');
      if (saved && ORDER.indexOf(saved) !== -1) idx = ORDER.indexOf(saved);
    } catch (e) {}

    const canvas = document.getElementById('scene');
    const title = document.getElementById('title');
    const hint = document.getElementById('hint');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 320);
    const globe = new THREE.Group();
    scene.add(globe);
    const RADIUS = 100;

    function dotTexture() {
      const s = 64, c = document.createElement('canvas');
      c.width = c.height = s;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.4, 'rgba(255,255,255,0.9)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
      const t = new THREE.Texture(c); t.needsUpdate = true; return t;
    }
    const sprite = dotTexture();

    // dots on a sphere (fibonacci)
    const COUNT = 3500;
    const positions = new Float32Array(COUNT * 3);
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < COUNT; i++) {
      const y = 1 - (i / (COUNT - 1)) * 2;
      const r = Math.sqrt(1 - y * y);
      const theta = golden * i;
      positions[i*3] = Math.cos(theta) * r * RADIUS;
      positions[i*3+1] = y * RADIUS;
      positions[i*3+2] = Math.sin(theta) * r * RADIUS;
    }
    const dotGeo = new THREE.BufferGeometry();
    dotGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const dotMat = new THREE.PointsMaterial({
      size: 2.6, map: sprite, transparent: true, opacity: 0.95,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
    });
    globe.add(new THREE.Points(dotGeo, dotMat));

    const wireMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.4 });
    globe.add(new THREE.LineSegments(
      new THREE.WireframeGeometry(new THREE.SphereGeometry(RADIUS * 0.985, 36, 24)), wireMat
    ));

    const glowMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.6 });
    globe.add(new THREE.Mesh(new THREE.SphereGeometry(RADIUS * 0.96, 48, 48), glowMat));

    // starfield
    const STARS = 1400;
    const starPos = new Float32Array(STARS * 3);
    for (let i = 0; i < STARS; i++) {
      const rr = 500 + Math.random() * 400;
      const t1 = Math.random() * Math.PI * 2;
      const t2 = Math.acos(Math.random() * 2 - 1);
      starPos[i*3] = rr * Math.sin(t2) * Math.cos(t1);
      starPos[i*3+1] = rr * Math.sin(t2) * Math.sin(t1);
      starPos[i*3+2] = rr * Math.cos(t2);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      size: 1.4, transparent: true, opacity: 0.6,
      map: sprite, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // --- apply a theme to CSS + 3D materials ---
    function applyTheme(key) {
      const T = THEMES[key];
      document.body.style.background =
        'radial-gradient(circle at 50% 42%, ' + T.bgIn + ' 0%, ' + T.bgOut + ' 62%, #000 100%)';
      title.style.color = T.text;
      title.style.textShadow = '0 0 34px ' + T.shadow;
      hint.style.color = T.sub;
      dotMat.color.set(T.dot);
      wireMat.color.set(T.wire);
      glowMat.color.set(T.glow);
      starMat.color.set(T.star);
    }
    applyTheme(ORDER[idx]);

    // click/tap the title to cycle colors
    title.addEventListener('click', function (e) {
      e.stopPropagation();
      idx = (idx + 1) % ORDER.length;
      applyTheme(ORDER[idx]);
      try { localStorage.setItem('whirld-theme', ORDER[idx]); } catch (err) {}
    });

    // --- drag-to-spin + auto-rotate ---
    let interacted = false, dragging = false, lastX = 0, lastY = 0;
    let velX = 0.0025, targetTilt = 0;
    function onDown(e) {
      dragging = true;
      const p = e.touches ? e.touches[0] : e;
      lastX = p.clientX; lastY = p.clientY;
      if (!interacted) { interacted = true; hint.style.opacity = '0'; }
    }
    function onMove(e) {
      if (!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      velX = (p.clientX - lastX) * 0.005;
      targetTilt = Math.max(-0.9, Math.min(0.9, targetTilt + (p.clientY - lastY) * 0.005));
      lastX = p.clientX; lastY = p.clientY;
      if (e.cancelable) e.preventDefault();
    }
    function onUp() { dragging = false; }
    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);
    setTimeout(() => { if (!interacted) hint.style.opacity = '0'; }, 6500);

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.fov = w < 640 ? 58 : 45;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize); resize();

    (function animate() {
      requestAnimationFrame(animate);
      if (!dragging) velX += (0.0025 - velX) * 0.03;
      globe.rotation.y += velX;
      globe.rotation.x += (targetTilt - globe.rotation.x) * 0.08;
      stars.rotation.y += 0.0003;
      renderer.render(scene, camera);
    })();
  })();
  </script>
</body>
</html>
