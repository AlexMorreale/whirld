<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whirld</title>
<meta name="description" content="whirld">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05070f; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 45%, #0b1330 0%, #05070f 60%, #02030a 100%);
  }
  #scene { position: fixed; inset: 0; display: block; }
  #title {
    position: fixed;
    left: 50%;
    bottom: 7vh;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    user-select: none;
    z-index: 2;
  }
  #title h1 {
    font-size: clamp(2.2rem, 9vw, 5.5rem);
    font-weight: 300;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    color: #eaf2ff;
    text-shadow: 0 0 30px rgba(90, 170, 255, 0.55);
  }
  #title p {
    margin-top: 0.6em;
    font-size: clamp(0.7rem, 2.2vw, 0.95rem);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    color: rgba(150, 180, 230, 0.6);
  }
  #hint {
    position: fixed;
    top: 5vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.72rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(130, 160, 210, 0.45);
    pointer-events: none;
    user-select: none;
    z-index: 2;
    transition: opacity 1s ease;
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hint">drag to spin</div>
  <div id="title">
    <h1>whirld</h1>
    <p>clones</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (function () {
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 320);

    const globe = new THREE.Group();
    scene.add(globe);

    const RADIUS = 100;

    // --- round dot sprite texture ---
    function dotTexture() {
      const s = 64;
      const c = document.createElement('canvas');
      c.width = c.height = s;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.4, 'rgba(255,255,255,0.9)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, s, s);
      const t = new THREE.Texture(c);
      t.needsUpdate = true;
      return t;
    }

    // --- dots distributed evenly on a sphere (fibonacci) ---
    const COUNT = 3500;
    const positions = new Float32Array(COUNT * 3);
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < COUNT; i++) {
      const y = 1 - (i / (COUNT - 1)) * 2;
      const r = Math.sqrt(1 - y * y);
      const theta = golden * i;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;
      positions[i * 3] = x * RADIUS;
      positions[i * 3 + 1] = y * RADIUS;
      positions[i * 3 + 2] = z * RADIUS;
    }
    const dotGeo = new THREE.BufferGeometry();
    dotGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const dotMat = new THREE.PointsMaterial({
      size: 2.6,
      map: dotTexture(),
      color: 0x5ac8ff,
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true,
    });
    globe.add(new THREE.Points(dotGeo, dotMat));

    // --- subtle wireframe sphere (lat/long grid) ---
    const wire = new THREE.LineSegments(
      new THREE.WireframeGeometry(new THREE.SphereGeometry(RADIUS * 0.985, 36, 24)),
      new THREE.LineBasicMaterial({ color: 0x1e3a6b, transparent: true, opacity: 0.35 })
    );
    globe.add(wire);

    // --- soft inner glow sphere ---
    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(RADIUS * 0.96, 48, 48),
      new THREE.MeshBasicMaterial({ color: 0x0a2550, transparent: true, opacity: 0.55 })
    );
    globe.add(glow);

    // --- starfield ---
    const STARS = 1400;
    const starPos = new Float32Array(STARS * 3);
    for (let i = 0; i < STARS; i++) {
      const rr = 500 + Math.random() * 400;
      const t1 = Math.random() * Math.PI * 2;
      const t2 = Math.acos(Math.random() * 2 - 1);
      starPos[i * 3] = rr * Math.sin(t2) * Math.cos(t1);
      starPos[i * 3 + 1] = rr * Math.sin(t2) * Math.sin(t1);
      starPos[i * 3 + 2] = rr * Math.cos(t2);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
      size: 1.4, color: 0x9fb8e8, transparent: true, opacity: 0.6,
      map: dotTexture(), depthWrite: false, blending: THREE.AdditiveBlending,
    }));
    scene.add(stars);

    // --- custom drag-to-spin + auto-rotate (no external controls needed) ---
    const hint = document.getElementById('hint');
    let interacted = false;
    let dragging = false;
    let lastX = 0, lastY = 0;
    let velX = 0.0025, velY = 0;        // current angular velocity (auto-rotate baseline)
    let targetTilt = 0;                 // vertical tilt accumulated from drag

    function onDown(e) {
      dragging = true;
      const p = e.touches ? e.touches[0] : e;
      lastX = p.clientX; lastY = p.clientY;
      if (!interacted) { interacted = true; hint.style.opacity = '0'; }
    }
    function onMove(e) {
      if (!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      const dx = p.clientX - lastX;
      const dy = p.clientY - lastY;
      lastX = p.clientX; lastY = p.clientY;
      velX = dx * 0.005;
      targetTilt = Math.max(-0.9, Math.min(0.9, targetTilt + dy * 0.005));
      if (e.cancelable) e.preventDefault();
    }
    function onUp() { dragging = false; }

    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);

    setTimeout(() => { if (!interacted) hint.style.opacity = '0'; }, 6000);

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.fov = w < 640 ? 58 : 45;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      // ease toward baseline auto-rotate speed when not dragging
      if (!dragging) velX += (0.0025 - velX) * 0.03;
      globe.rotation.y += velX;
      globe.rotation.x += (targetTilt - globe.rotation.x) * 0.08;
      stars.rotation.y += 0.0003;
      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
</body>
</html>
